<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>撮影現場プレビュー — full body + shot camera</title>
  <style>
    html, body { margin: 0; background: #1a1a1e; color: #eee; font-family: system-ui, sans-serif; }
    header { padding: 12px 16px; }
    h1 { margin: 0; font-size: 16px; color: #fbbf24; }
    p { margin: 6px 0 0; font-size: 12px; color: #94a3b8; }
    #stage { width: min(560px, 100vw); margin: 0 auto; min-height: 500px; }
    .tags { padding: 8px 16px 24px; font-size: 11px; color: #7dd3fc; text-align: center; }
  </style>
</head>
<body>
  <header>
    <h1>撮影現場プレビュー（2人・全景⇄ショット）</h1>
    <p>全景で配置 → ショット視点で「この絵になるよ」を確認</p>
  </header>
  <div id="viewbar" style="display:flex;gap:8px;justify-content:center;padding:0 16px 8px">
    <button data-mode="overview" type="button" style="border:1px solid #475569;border-radius:8px;padding:6px 12px;background:transparent;color:#94a3b8;cursor:pointer">全景</button>
    <button data-mode="shot" type="button" style="border:1px solid #475569;border-radius:8px;padding:6px 12px;background:transparent;color:#94a3b8;cursor:pointer">ショット視点</button>
  </div>
  <div id="stage"></div>
  <p class="tags">2girls · crouching + standing · from_side, from_below</p>
  <script type="module" src="/src/chibiDemoMain.js"></script>
</body>
</html>
