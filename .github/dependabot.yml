version: 2

# Minor and patch updates arrive as one PR per ecosystem a week; majors come alone.
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule: { interval: weekly, day: monday }
    groups:
      python-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly, day: monday }
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: docker
    directories: [/backend, /frontend]
    schedule: { interval: weekly, day: monday }
